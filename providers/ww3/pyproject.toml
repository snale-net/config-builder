[build-system]
requires = ["flit_core==3.12.0"]
build-backend = "flit_core.buildapi"

[project]
name = "configbuilder-providers-ww3"
version = "0.1"
requires-python = ">=3.9"
authors = [
  {name = "Fabien RÉTIF", email = "fabien.retif@snale.net"},
]
description = "Provider package configbuilder-providers-ww3 for ConfigBuilder"
readme = "README.md"

dependencies = [
    "configbuilder==0.1",
    "netCDF4==1.6.5",
    "gdal==3.12.1"
]

[project.urls]
Homepage = "https://lab.snale.net/"
Documentation = " "
Repository = "https://github.com/snale-net/pyConfigBuilder"

[tool.uv.sources]
# These names must match the names as defined in the pyproject.toml of the workspace items,
# *not* the workspace folder paths
configbuilder = {workspace = true}

[tool.flit.module]
name = "configbuilder.providers.ww3"